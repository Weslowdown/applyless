[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applyless"
version = "0.1.0"
description = "Rank job descriptions by real resume evidence, locally and without an API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Weslowdown" }]
keywords = ["job-search", "resume", "career", "local-first", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = []
pdf = ["pypdf>=5.0"]

[project.scripts]
applyless = "applyless.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
applyless = ["data/*.json", "data/*.txt", "static/*"]

